spring.application.name=jvm-doctor-java

# stdio 传输：客户端把这个进程当子进程拉起，不起 web 容器
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.name=jvm-doctor-java
spring.ai.mcp.server.version=0.1.0

# ⚠️ stdout 是 MCP 的协议通道。Spring Boot 默认把日志打到 stdout，
#    不改这两行，第一条日志就会污染协议流、让客户端解析失败。
#    这是 Python 侧那个 print() 陷阱的 Java 版本，而且默认行为更危险 ——
#    Python 要你主动 print 才出事，Spring Boot 不配置就一定出事。
logging.pattern.console=
logging.file.name=./jvm-doctor-java.log
